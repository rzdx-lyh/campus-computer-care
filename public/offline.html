<!doctype html>
<!-- 用途：Service Worker 导航失败时展示的纯静态离线兜底页。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2273eb" />
    <title>离线 · 校园电脑管家</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
        background:
          radial-gradient(circle at 10% 0%, rgba(219, 238, 254, .95), transparent 28rem),
          #f8fafc;
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 24px 70px -30px rgba(30, 69, 138, .35);
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        color: #fff;
        font-size: 34px;
        background: linear-gradient(135deg, #1a5dd8, #38bdf8);
      }
      h1 { margin: 0; font-size: 28px; }
      p { margin: 16px 0 0; color: #64748b; line-height: 1.8; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        padding: 13px 22px;
        border-radius: 12px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        background: #2273eb;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">⌁</div>
      <h1>当前处于离线状态</h1>
      <p>AI 诊断与联网搜索需要网络连接。你仍然可以打开知识图谱，查看 25 条本地故障知识。</p>
      <a href="/graph">打开离线故障知识图谱</a>
    </main>
  </body>
</html>
